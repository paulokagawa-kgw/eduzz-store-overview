<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Eduzz Store Ads</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #F7F4EE;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-wrap {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 44px;
    height: 44px;
    background: #0D1B3E;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: #F5B800;
    letter-spacing: -1px;
  }
  .logo-text {
    display: flex;
    flex-direction: column;
  }
  .logo-text span:first-child {
    font-size: 15px;
    font-weight: 700;
    color: #0D1B3E;
    line-height: 1.2;
  }
  .logo-text span:last-child {
    font-size: 11px;
    font-weight: 500;
    color: #6B7280;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(13,27,62,.08), 0 1px 4px rgba(13,27,62,.04);
    padding: 40px 36px 32px;
    width: 100%;
  }
  .card-title {
    font-size: 22px;
    font-weight: 700;
    color: #0D1B3E;
    margin-bottom: 6px;
  }
  .card-sub {
    font-size: 14px;
    color: #6B7280;
    margin-bottom: 28px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 18px;
  }
  .field label {
    font-size: 13px;
    font-weight: 600;
    color: #0D1B3E;
  }
  .field input {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    border: 1.5px solid rgba(13,27,62,.12);
    border-radius: 8px;
    outline: none;
    color: #0D1B3E;
    background: #fff;
    transition: border-color .2s;
  }
  .field input:focus {
    border-color: #0D1B3E;
  }
  .field input::placeholder {
    color: #adb5bd;
  }
  .btn-login {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    background: #0D1B3E;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    width: 100%;
    cursor: pointer;
    margin-top: 8px;
    transition: background .2s;
    letter-spacing: 0.2px;
  }
  .btn-login:hover { background: #162d5e; }
  .demo-box {
    background: #F7F4EE;
    border-radius: 8px;
    padding: 14px 16px;
    margin-top: 20px;
    font-size: 13px;
    color: #6B7280;
    line-height: 1.5;
  }
  .demo-box strong {
    color: #0D1B3E;
    font-weight: 600;
  }
  .footer-note {
    font-size: 12px;
    color: #9CA3AF;
    text-align: center;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-icon">E</div>
    <div class="logo-text">
      <span>Eduzz</span>
      <span>Store Ads</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Entrar na plataforma</div>
    <div class="card-sub">Acesse seu painel de anúncios</div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="builder@demo.com" value="">
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="••••••••" value="">
    </div>

    <button class="btn-login" onclick="window.location.href='dashboard.html'">Entrar</button>

    <div class="demo-box">
      <strong>Demo:</strong> builder@demo.com / Admin123!
    </div>
  </div>

  <div class="footer-note">© 2026 Eduzz. Todos os direitos reservados.</div>
</div>
</body>
</html>
